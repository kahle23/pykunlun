[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pykunlun"
version = "0.0.2"
description = "Kunlun，与具体业务无关的 Python 底层能力库。承载跨平台、跨业务的通用抽象与基础设施，不依赖上层应用包。"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    {name = "Kahle"}
]
dependencies = [
]

[tool.setuptools.packages.find]
where = ["src"]

# 包含 PEP 561 类型标记 py.typed，使下游（如 baibao）能对本包做类型检查；
# 详见 src/pykunlun/py.typed 的注释。
[tool.setuptools.package-data]
pykunlun = ["py.typed"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
# 行宽策略：期望 100，硬上限 120（E501 据此报错）。
# 多出的 20 为预留冗余，给中文 docstring、长标识符、不可拆分的 URL 留缓冲，
# 避免为凑 100 而生硬折行；新代码仍以 100 为目标，100–120 之间可容忍。
line-length = 120

[tool.ruff.lint]
# 默认 select（E4/E7/E9/F）不含 E501，显式开启行长检查；阈值见 [tool.ruff] line-length。
extend-select = ["E501"]
ignore = [
    "S110",    # try-except-pass：资源清理场景，静默是预期行为
    "BLE001",  # 盲异常：与 S110 重叠的工具库资源清理场景
    "DTZ005",  # datetime.now() 无 tz：工具库默认使用 naive datetime
    "DTZ007",  # strptime 无 %z：同上
    # PIE790：不必要的 pass 语句
    # 抽象方法、空实现方法、异常子类等场景显式保留 pass，更直观表达
    # "此处为空占位/待子类实现" 的意图，与 docstring 配合可读性更好。
    "PIE790",
]
